<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="page-header">
        <h1>Hubungi Kami</h1>
        <p>
            Sampaikan pertanyaan atau pesan Anda
            mengenai wisata Kalimantan Selatan.
        </p>
    </section>
    <section class="contact-section">
        <form class="contact-form">
            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Masukkan email" required>
            <label for="wisata">Destinasi Wisata</label>
            <select id="wisata" name="wisata">

                <option value="">
                    Pilih destinasi
                </option>

                <option value="loksado">
                    Loksado
                </option>

                <option value="meratus">
                    Pegunungan Meratus
                </option>

                <option value="tahura">
                    Tahura Sultan Adam
                </option>

            </select>


            <label for="pesan">Pesan</label>

            <textarea id="pesan" name="pesan" rows="6" placeholder="Tulis pesan Anda..."></textarea>


            <button type="submit">
                Kirim Pesan
            </button>

        </form>

    </section>

</body>

</html>
